name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/wanderlust

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Seed MongoDB with sample posts
        working-directory: backend
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import mongoose from 'mongoose';
          import Post from './models/post.js';

          const samplePosts = JSON.parse(await readFile('./data/sample_posts.json', 'utf8'));
          const posts = samplePosts.map((post) => ({
            ...post,
            _id: post._id?.$oid ?? post._id,
            timeOfPost: post.timeOfPost?.$date ?? post.timeOfPost,
          }));

          await mongoose.connect(process.env.MONGODB_URI);
          await Post.insertMany(posts);
          await mongoose.disconnect();
          NODE

      - name: Run backend tests
        run: npm run test:ci --prefix backend

      - name: Start backend for frontend integration tests
        env:
          PORT: 3001
        run: npm --prefix backend start > "$RUNNER_TEMP/backend.log" 2>&1 &

      - name: Wait for backend API
        run: curl --fail --retry 30 --retry-connrefused --retry-delay 2 --retry-max-time 60 http://127.0.0.1:3001/api/posts

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Run frontend tests
        run: npm test --prefix frontend -- --runInBand
